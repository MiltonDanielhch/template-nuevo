# Código 3026: El Guardián de la Sintonía (Versión Optimizada)
repos:
  # --- Guardianes Genéricos ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer # Altamente recomendado para evitar ruidos en Git

  # --- Guardián de Frontend (Biome) ---
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.4.5
    hooks:
      - id: biome-check

  # --- Guardianes de Rust ---
  - repo: local
    hooks:
      - id: fmt
        name: Rust Fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: clippy
        name: Rust Clippy
        entry: cargo clippy --workspace -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

  # --- Guardián del ADN (Protobuf) ---
  - repo: https://github.com/bufbuild/buf
    rev: v1.50.0
    hooks:
      - id: buf-lint
        args: ["proto"]
        pass_filenames: false
        files: proto
