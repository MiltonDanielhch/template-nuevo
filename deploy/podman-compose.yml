version: '3.8'

services:
  # Servicio Backend (Nuestra API en Rust)
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: lab3026_api
    restart: unless-stopped
    ports:
      # =======================================================================
      # NOTA PARA VPS LIMPIO: Cambiar a "8080:8080" (puerto externo 8080)
      # Aquì usas 8081 porque el 8080 està ocupado en tu màquina local
      # =======================================================================
      - "8081:8080"
    environment:
      - DATABASE_URL=sqlite:///app/data/backend.db?mode=rwc
      - RUST_LOG=info
      - HOST=0.0.0.0
      - SERVER_PORT=8080
    volumes:
      # Persistencia de SQLite (WAL)
      - backend_data:/app/data
    networks:
      - lab3026_net

  # Servicio Reverse Proxy (Caddy)
  caddy:
    image: caddy:2-alpine
    container_name: lab3026_caddy
    restart: unless-stopped
    ports:
      # =======================================================================
      # NOTA PARA VPS LIMPIO: Cambiar a "80:80" y "443:443"
      # Aquì usas 9080 y 9443 porque 80 y 443 estàn ocupados en tu màquina local
      # =======================================================================
      - "9080:80"
      - "9443:443"
      - "9443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - lab3026_net
    depends_on:
      - app

volumes:
  backend_data:
  caddy_data:
  caddy_config:

networks:
  lab3026_net:
    driver: bridge
