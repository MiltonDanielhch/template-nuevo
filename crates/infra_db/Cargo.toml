[package]
name = "infra_db"
version = "0.1.0"
edition = "2024"

[dependencies]
core_logic = { path = "../core_logic" } # Depende de la lógica de dominio

anyhow = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono"] }
async-trait = "0.1"
tokio = { version = "1.36", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.7", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

