// Código 3026: El ADN de la Identidad
// Este contrato define la estructura fundamental de usuarios y los servicios de autenticación.
// Es la fuente de verdad para Rust (backend) y TypeScript (frontend).

syntax = "proto3";

package auth.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

service AuthService {
  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);
  rpc LoginUser(LoginUserRequest) returns (LoginUserResponse);
}

message User {
  common.v1.Uuid id = 1;
  string username = 2;
  string email = 3;
  string password_hash = 4;
  string avatar_url = 5;
  bool email_verified = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp deleted_at = 9;
}

message RegisterUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message RegisterUserResponse { User user = 1; }

message LoginUserRequest {
  string email = 1;
  string password = 2;
}

message LoginUserResponse {
  string session_token = 1;
  User user = 2;
}
